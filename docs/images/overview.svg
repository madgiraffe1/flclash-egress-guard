<g transform="translate(348 222) scale(0.909091)"><circle r="11" fill="#22A06B" stroke="#fff" stroke-width="2"/><path d="M-5 0.5l3.4 3.4L5.5 -4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="100" y="244" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">Mac</text>
<text x="398" y="194" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">Internet</text>
<text x="392" y="278" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">LAN</text>
<text x="50" y="314" font-size="14.5" font-weight="400" fill="#0B1F33" fill-opacity="0.85">Apps reach the internet only through FlClash's TUN.</text>
<text x="50" y="335" font-size="14.5" font-weight="400" fill="#0B1F33" fill-opacity="0.85">Anything trying to go around it is dropped.</text>
<rect x="492" y="24" width="444" height="332" rx="18" fill="#fff" stroke="#D7E1EA" stroke-width="1.2" filter="url(#fcg-shadow)"/>
