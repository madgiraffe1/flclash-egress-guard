<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="What FlClash Egress Guard does when FlClash is connected and when it drops">
<title>What FlClash Egress Guard does when FlClash is connected and when it drops</title>
<defs>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif;} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;}@keyframes fcg-dash{to{stroke-dashoffset:-32}}.fcg-flow{animation:fcg-dash 1.4s linear infinite}@media (prefers-reduced-motion: reduce){.fcg-flow{animation:none}}</style>
<linearGradient id="fcg-brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08335C"/><stop offset="1" stop-color="#148CAB"/></linearGradient>
<filter id="fcg-shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0B1F33" flood-opacity=".13"/></filter>
</defs>
<rect x=".5" y=".5" width="959" height="379" rx="22" fill="#F6F9FC" stroke="#D7E1EA"/>
<rect x="24" y="24" width="444" height="332" rx="18" fill="#fff" stroke="#D7E1EA" stroke-width="1.2" filter="url(#fcg-shadow)"/>
