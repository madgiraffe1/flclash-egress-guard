<g fill="none" stroke="#0B1F33" stroke-width="2.4"><circle cx="866" cy="144" r="30" fill="#fff" fill-opacity="1"/><ellipse cx="866" cy="144" rx="13.2" ry="30"/><path d="M836 144h60M838.774 131.4h54.4514M838.774 156.6h54.4514"/></g>
<g transform="translate(860 242) scale(0.82)"><path d="M-20 -12l-7-18M20 -12l7-18" stroke="#0B1F33" stroke-width="2.6" stroke-linecap="round"/><rect x="-36" y="-12" width="72" height="28" rx="8" fill="#fff" fill-opacity="1" stroke="#0B1F33" stroke-width="2.6"/><circle cx="-18" cy="2" r="3" fill="#22A06B"/><circle cx="-6" cy="2" r="3" fill="#22A06B"/><circle cx="6" cy="2" r="3" fill="#22A06B"/></g>
<g transform="translate(816 222) scale(0.909091)"><circle r="11" fill="#22A06B" stroke="#fff" stroke-width="2"/><path d="M-5 0.5l3.4 3.4L5.5 -4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="568" y="244" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">Mac</text>
<text x="866" y="194" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">Internet</text>
<text x="860" y="278" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">LAN</text>
<text x="518" y="314" font-size="14.5" font-weight="400" fill="#0B1F33" fill-opacity="0.85">No silent fallback to a direct connection. LAN,</text>
<text x="518" y="335" font-size="14.5" font-weight="400" fill="#0B1F33" fill-opacity="0.85">printers and localhost keep working; one click reconnects.</text>
