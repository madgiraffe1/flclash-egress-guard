<path d="M144 202C220 222 282 242 350 242" fill="none" stroke="#22A06B" stroke-width="2.6"/>
<path d="M130 158C140 136 146 136 184 136M308 136H362" fill="none" stroke="#148CAB" stroke-width="3"/>
